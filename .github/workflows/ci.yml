name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (bug-class rules only — see ruff.toml)
        run: ruff check app tests
      - name: Python tests
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Frontend syntax + money-math regression
        run: |
          node --check app/static/app.js
          node --check app/static/journal.js
          node --check app/static/ai.js
          node --check app/static/exec.js
          node --check app/static/login.js
          node --check app/static/theme.js
          node tests/test_snap.mjs
